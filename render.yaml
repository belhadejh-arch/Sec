services:
  - type: web
    name: securo-backend
    runtime: node
    buildCommand: npm install --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org/ && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: NEON_DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://sec-rosy.vercel.app
      - key: COOKIE_SAME_SITE
        value: none